name: Java CI/CD with Gradle

on:
  push:
    branches: [ "main" ] # main 브랜치에 push될 때 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 0. 소스코드 체크아웃
      - uses: actions/checkout@v4

      # 1. JDK 설정 + Gradle 캐시
      #    cache: 'gradle' 로 ~/.gradle/caches 를 저장/복원 → 의존성 재다운로드 생략
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # 1.5 Firebase 서비스 계정 키 생성 (빌드 시 jar 에 포함되므로 빌드 전에 실행)
      - name: Create Firebase Service Account JSON
        run: |
          mkdir -p src/main/resources
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > src/main/resources/firebase-service-account.json

      # 2. Gradle 빌드 (실행용 jar만 생성)
      #    - clean 제거: CI 는 매번 새 러너라 지울 결과물이 없음
      #    - build → bootJar: check/검증 태스크 생략
      #    - --build-cache: 변경된 부분만 재컴파일
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test --build-cache

      # 3. [SCP] 빌드된 새 jar 를 EC2 임시 폴더(app/new)로 전송
      #    옛 서버가 아직 살아있으므로 옛 jar 와 섞이지 않도록 별도 폴더에 대피
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app/new"
          strip_components: 2

      # 4. [SSH] 옛 서버 종료 → 새 jar 교체 → 새 서버 실행 (연결 1회)
      - name: Restart server on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e

            echo "--- 기존 프로세스 정리 ---"
            PIDS=$(pgrep -f 'java .*YakSok' || true)
            if [ -n "$PIDS" ]; then
              echo "종료할 PID: $PIDS"
              sudo kill -9 $PIDS
            else
              echo "실행 중인 YakSok 프로세스가 없습니다."
            fi

            echo "--- 새 jar 배치 ---"
            mkdir -p /home/ubuntu/app
            rm -f /home/ubuntu/app/*.jar /home/ubuntu/app/nohup.out
            rm -f /home/ubuntu/YakSok-0.0.1-SNAPSHOT.jar
            mv /home/ubuntu/app/new/*.jar /home/ubuntu/app/
            rmdir /home/ubuntu/app/new 2>/dev/null || true
            ls -al /home/ubuntu/app/

            echo "--- 새 서버 실행 ---"
            export JWT_SECRET='${{ secrets.JWT_SECRET }}'
            export DB_PASSWORD='${{ secrets.DB_PASSWORD }}'
            export MEDICINE_API_KEY='${{ secrets.MEDICINE_API_KEY }}'
            export DRUGSTORE_API_KEY='${{ secrets.DRUGSTORE_API_KEY }}'
            export MAIL_USERNAME='${{ secrets.MAIL_USERNAME }}'
            export MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}'
            nohup java -Xms512m -Xmx512m -jar /home/ubuntu/app/*.jar --server.port=8080 > /home/ubuntu/app/nohup.out 2>&1 &
