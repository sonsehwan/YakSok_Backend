logging:
  level:
    com.sehwan.YakSok: INFO
    org.hibernate.SQL: DEBUG

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 600000

kakao:
  # 카카오 토큰이 우리 앱에서 발급된 것인지 검증할 때 비교하는 앱 ID. 비어 있으면 카카오 로그인은 전부 거절된다
  app-id: ${KAKAO_APP_ID:}

api:
  medicine:
    service-key: ${MEDICINE_API_KEY}
    url: "https://apis.data.go.kr/1471000/MdcinGrnIdntfcInfoService03/getMdcinGrnIdntfcInfoList03"

  drugstore:
    service-key: ${DRUGSTORE_API_KEY}
    url: "https://apis.data.go.kr/B552657/ErmctInsttInfoInqireService"

spring:
  application:
    name: YakSok

  config:
    import: optional:application-local.yaml

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yaksok?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false