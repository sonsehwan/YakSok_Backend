logging:
  level:
    com.sehwan.YakSok: INFO
    org.hibernate.SQL: DEBUG

api:
  medicine:
    service-key: ${MEDICINE_API_KEY}
    url: "https://apis.data.go.kr/1471000/MdcinGrnIdntfcInfoService03/getMdcinGrnIdntfcInfoList03"

  drugstore:
    service-key: ${DRUGSTORE_API_KEY}
    url: "https://apis.data.go.kr/B552657/ErmctInsttInfoInqireService"

spring:
  application:
    name: YakSok

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yaksok?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false